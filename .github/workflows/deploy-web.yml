name: Build and deploy browser game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pygbag
        run: python -m pip install pygbag
      - name: Build browser game
        run: python -m pygbag --build main.py
      - name: Optimize web layout for 16:9 landscape aspect ratio
        run: python patch_web.py
      - name: Publish browser game to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/web
          force_orphan: true
